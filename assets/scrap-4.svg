<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Scrap 4 — first deploy confetti -->
  <rect width="512" height="512" fill="#e62429"/>
  <g stroke="#16181d" stroke-width="7" fill="#f5eeda">
    <rect x="96" y="150" width="320" height="190" rx="14"/>
  </g>
  <g font-family="monospace" font-weight="700" fill="#16181d">
    <text x="256" y="240" text-anchor="middle" font-size="34">git push</text>
    <text x="256" y="300" text-anchor="middle" font-size="38" fill="#2f9e57">✓ deployed</text>
  </g>
  <g fill="#ffd23e" stroke="#16181d" stroke-width="5">
    <rect x="130" y="80" width="26" height="40" transform="rotate(18 143 100)"/>
    <rect x="240" y="60" width="26" height="40" transform="rotate(-14 253 80)"/>
    <rect x="350" y="84" width="26" height="40" transform="rotate(22 363 104)"/>
    <rect x="180" y="380" width="26" height="40" transform="rotate(-20 193 400)"/>
    <rect x="300" y="392" width="26" height="40" transform="rotate(16 313 412)"/>
  </g>
  <text x="256" y="480" text-anchor="middle" font-family="Bangers, cursive" font-size="36" fill="#f5eeda">first deploy: hands shaking</text>
</svg>
